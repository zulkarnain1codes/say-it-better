name: Build app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild \
            -project SayItBetter.xcodeproj \
            -target SayItBetter \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          echo "Copy the lines below and send them to Claude:"
          grep -E "error:" build.log | sort -u | head -40 || true

      - name: Package the app
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SayItBetter.app Payload/
          zip -qry SayItBetter.ipa Payload

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Say it better (build ${{ github.run_number }})
          files: SayItBetter.ipa
          make_latest: true
